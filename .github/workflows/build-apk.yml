name: Build APK (All Types) + Auto Versioning

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Optional version name (e.g. 1.0.1). Leave empty to auto-detect.'
        required: false
        default: ''

permissions:
  contents: write   # required to create/update releases and upload assets

jobs:
  build-apk:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determine Version
        id: version
        run: |
          VERSION_CODE=${{ github.run_number }}

          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # tag like v1.0.1 → 1.0.1
            VERSION_NAME="${{ github.ref_name }}"
            VERSION_NAME="${VERSION_NAME#v}"
          else
            # from pubspec (strip any existing +build)
            VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          fi

          FULL_VERSION="${VERSION_NAME}+${VERSION_CODE}"

          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "FULL_VERSION=${FULL_VERSION}" >> $GITHUB_OUTPUT

          echo "========================================"
          echo "Version Name : ${VERSION_NAME}"
          echo "Version Code : ${VERSION_CODE}"
          echo "Full Version : ${FULL_VERSION}"
          echo "========================================"

      - name: Update version in pubspec.yaml
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.FULL_VERSION }}/" pubspec.yaml
          echo "Updated pubspec.yaml:"
          grep '^version:' pubspec.yaml

      - name: Get dependencies
        run: flutter pub get

      - name: Build Universal APK
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --build-name=${{ steps.version.outputs.VERSION_NAME }} \
            --build-number=${{ steps.version.outputs.VERSION_CODE }}

      - name: Build Split APKs (per ABI)
        run: |
          flutter build apk --release --split-per-abi --no-tree-shake-icons \
            --build-name=${{ steps.version.outputs.VERSION_NAME }} \
            --build-number=${{ steps.version.outputs.VERSION_CODE }}

      - name: Prepare release folder
        run: |
          mkdir -p release-apks
          V="${{ steps.version.outputs.VERSION_NAME }}"
          
          cp build/app/outputs/flutter-apk/app-release.apk             "release-apks/NexusFileManager-universal-v${V}.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release-apks/NexusFileManager-armeabi-v7a-v${V}.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "release-apks/NexusFileManager-arm64-v8a-v${V}.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      "release-apks/NexusFileManager-x86_64-v${V}.apk"
          
          echo "Generated APKs:"
          ls -lh release-apks/

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NexusFileManager-APKs-v${{ steps.version.outputs.VERSION_NAME }}-${{ steps.version.outputs.VERSION_CODE }}
          path: release-apks/*.apk
          retention-days: 90

      - name: Create GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nexus File Manager ${{ github.ref_name }}
          body: |
            ## Nexus File Manager ${{ github.ref_name }}
            
            **Powerful. Precise. Beautiful.**
            
            ### Android APKs
            | File | Recommended for |
            |------|-----------------|
            | `NexusFileManager-universal-*.apk` | All devices (larger size) |
            | `NexusFileManager-arm64-v8a-*.apk` | Most modern phones (best choice) |
            | `NexusFileManager-armeabi-v7a-*.apk` | Older 32-bit ARM devices |
            | `NexusFileManager-x86_64-*.apk` | Emulators / x86 devices |
            
            **Version Code:** `${{ steps.version.outputs.VERSION_CODE }}`
          files: release-apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update "Latest" Pre-release (main branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build (Auto)
          body: |
            ## Latest Continuous Build
            
            Automatic build from `main` branch.
            
            - **Version:** `${{ steps.version.outputs.VERSION_NAME }}`
            - **Version Code:** `${{ steps.version.outputs.VERSION_CODE }}`
            - **Commit:** ${{ github.sha }}
            
            ### APKs included
            - Universal
            - arm64-v8a (recommended)
            - armeabi-v7a
            - x86_64
          files: release-apks/*.apk
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
