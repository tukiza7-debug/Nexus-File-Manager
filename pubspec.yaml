name: nexus_file_manager
description: "Nexus File Manager — Powerful. Precise. Beautiful."
publish_to: "none"
version: 1.0.4+20

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Storage
  sqlite3: ^2.4.4
  sqlite3_flutter_libs: ^0.5.24
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  path: ^1.9.0

  # UI & motion
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10
  desktop_drop: ^0.4.4

  # Files & formats
  archive: ^3.6.1
  image: ^4.2.0
  exif: ^3.3.0
  crypto: ^3.0.3
  uuid: ^4.4.0

  # Platform integration
  window_manager: ^0.4.2
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  permission_handler: ^11.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo/nexus-logo-primary.svg
    - assets/logo/nexus-icon.svg

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVar.ttf
          weight: 100
        - asset: assets/fonts/InterVar.ttf
          weight: 200
        - asset: assets/fonts/InterVar.ttf
          weight: 300
        - asset: assets/fonts/InterVar.ttf
          weight: 400
        - asset: assets/fonts/InterVar.ttf
          weight: 500
        - asset: assets/fonts/InterVar.ttf
          weight: 600
        - asset: assets/fonts/InterVar.ttf
          weight: 700
        - asset: assets/fonts/InterVar.ttf
          weight: 800
