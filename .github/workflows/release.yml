# Release pipeline for Nexus File Manager (desktop + iOS).
#
# Triggered by pushing a tag (v1.0.1, v2.0.0, …) or manually. Builds signed-
# enough-for-testing artifacts and attaches them to the GitHub Release for
# that tag. Android APKs/AABs are produced by the dedicated
# "Build APK (All Types) + Auto Versioning" workflow (build-apk.yml), which
# also runs on tags — this workflow deliberately covers the other four
# targets so nothing is built twice:
#
#   Windows : x64 zip of the runner Release folder
#   Linux   : x64 tar.gz of the build bundle
#   macOS   : zip of the .app bundle (unsigned — right-click → Open on first run)
#   iOS     : sideload zip containing Payload/Runner.app (unsigned)
#
# The publish job downloads every build artifact and uploads the files to the
# existing release. Re-running a failed build job is safe — the publish step
# overwrites same-named assets.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Collect artifacts
        run: |
          mkdir -p dist
          tar -czf dist/nexus-file-manager-linux-x64.tar.gz \
              -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath dist/nexus-file-manager-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist

  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build macos --release

      - name: Collect artifacts
        run: |
          mkdir -p dist
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -n 1)
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            dist/nexus-file-manager-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist

  ios:
    name: iOS (unsigned, sideload)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      - name: Collect artifacts
        run: |
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qry dist/nexus-file-manager-ios-unsigned.zip Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: dist-ios
          path: dist

  publish:
    name: Attach artifacts to GitHub Release
    needs: [linux, windows, macos, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
