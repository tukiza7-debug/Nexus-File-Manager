name: Build APK (All Types)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # Allow manual trigger from Actions tab

jobs:
  build-apk:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos || true

      - name: Build Universal APK (all ABIs)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Split APKs (per ABI)
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: List generated APKs
        run: |
          echo "=== Universal APK ==="
          ls -lh build/app/outputs/flutter-apk/app-release.apk || true
          echo ""
          echo "=== Split APKs ==="
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Rename APKs for clarity
        run: |
          mkdir -p release-apks
          # Universal
          cp build/app/outputs/flutter-apk/app-release.apk release-apks/NexusFileManager-universal-v${{ github.ref_name }}.apk
          
          # Per-ABI
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-apks/NexusFileManager-armeabi-v7a-v${{ github.ref_name }}.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   release-apks/NexusFileManager-arm64-v8a-v${{ github.ref_name }}.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      release-apks/NexusFileManager-x86_64-v${{ github.ref_name }}.apk

          ls -lh release-apks/

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NexusFileManager-APKs-${{ github.ref_name }}
          path: release-apks/*.apk
          retention-days: 30

      - name: Create / Update GitHub Release and upload APKs
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Nexus File Manager ${{ github.ref_name }}
          body: |
            ## Nexus File Manager ${{ github.ref_name }}
            
            **Powerful. Precise. Beautiful.**
            
            ### Android APKs included:
            | File | Description |
            |------|-------------|
            | `NexusFileManager-universal-*.apk` | Universal APK (all architectures) |
            | `NexusFileManager-arm64-v8a-*.apk` | For modern 64-bit ARM devices (recommended) |
            | `NexusFileManager-armeabi-v7a-*.apk` | For older 32-bit ARM devices |
            | `NexusFileManager-x86_64-*.apk` | For x86_64 emulators / devices |
            
            ### How to install
            1. Download the APK that matches your device (arm64-v8a is best for most phones)
            2. Enable "Install from unknown sources"
            3. Install the APK
            
            ---
            Built automatically by GitHub Actions.
          files: |
            release-apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
