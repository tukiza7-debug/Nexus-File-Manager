include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_use_of_internal_member: error
    unused_import: warning
    # Audit item 44: using a BuildContext after an await without a mounted
    # check is a real crash class, not a style nit — treat it as an error.
    use_build_context_synchronously: error

formatter:
  page_width: 100

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - avoid_redundant_argument_values
    - avoid_unused_constructor_parameters
    # cascade_invocations is intentionally omitted — chained builders read
    # better in this codebase's declarative UI style.
    - cancel_subscriptions
    - directives_ordering
    - no_runtimeType_toString
    - omit_local_variable_types
    - only_throw_errors
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_string_interpolations
    - use_enums
    - use_if_null_to_convert_nulls_to_bools
    - use_super_parameters
